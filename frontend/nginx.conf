server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    location /AI/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /AI/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /AI/index.html;
    }
}
