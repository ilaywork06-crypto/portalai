# Development stack: hot reload for every service and the frontend, demo data seeded on first start.
#   docker compose up --build        →  http://localhost:8080/AI/
# Sign-in: SSO_MODE=dev (stand-in IdP, default) | off (passwords only); real SSO with Keycloak: docker-compose.sso.yml
name: portal-ai

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
    interval: 10s
    timeout: 3s
    start_period: 30s
    retries: 5

x-service-env: &service-env
  ENVIRONMENT: development
  LOG_LEVEL: INFO
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-0001}
  SEED_DEMO_DATA: "true"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth:
    <<: *service
    build: { context: ., dockerfile: deploy/docker/service.Dockerfile, target: dev, args: { SERVICE: auth, PACKAGE: auth-service } }
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://auth_svc:auth_dev@postgres:5432/auth
      COOKIE_SECURE: "false"
      PUBLIC_URL: http://localhost:${GATEWAY_PORT:-8080}
      SSO_MODE: ${SSO_MODE:-dev}
      SSO_DEV_USERNAME: ${SSO_DEV_USERNAME:-alon.cohen}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-preferred_username}
    volumes:
      - ./libs/portal-kit/src:/app/libs/portal-kit/src
      - ./services/auth/src:/app/services/auth/src
      - ./services/auth/migrations:/app/services/auth/migrations

  marketplace:
    <<: *service
    build: { context: ., dockerfile: deploy/docker/service.Dockerfile, target: dev, args: { SERVICE: marketplace, PACKAGE: marketplace-service } }
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://marketplace_svc:marketplace_dev@postgres:5432/marketplace
    volumes:
      - ./libs/portal-kit/src:/app/libs/portal-kit/src
      - ./services/marketplace/src:/app/services/marketplace/src
      - ./services/marketplace/migrations:/app/services/marketplace/migrations

  community:
    <<: *service
    build: { context: ., dockerfile: deploy/docker/service.Dockerfile, target: dev, args: { SERVICE: community, PACKAGE: community-service } }
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://community_svc:community_dev@postgres:5432/community
      UPLOADS_DIR: /data/uploads
    volumes:
      - ./libs/portal-kit/src:/app/libs/portal-kit/src
      - ./services/community/src:/app/services/community/src
      - ./services/community/migrations:/app/services/community/migrations
      - uploads:/data/uploads

  usage:
    <<: *service
    build: { context: ., dockerfile: deploy/docker/service.Dockerfile, target: dev, args: { SERVICE: usage, PACKAGE: usage-service } }
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://usage_svc:usage_dev@postgres:5432/usage
    volumes:
      - ./libs/portal-kit/src:/app/libs/portal-kit/src
      - ./services/usage/src:/app/services/usage/src
      - ./services/usage/migrations:/app/services/usage/migrations

  frontend:
    build: { context: ./frontend, target: dev }
    restart: unless-stopped
    environment:
      VITE_HMR_CLIENT_PORT: ${GATEWAY_PORT:-8080}
      VITE_ALLOWED_HOSTS: all
    volumes:
      - ./frontend:/app
      - /app/node_modules

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      WEB_UPSTREAM: frontend:5173
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    volumes:
      - ./deploy/gateway/templates:/etc/nginx/templates:ro
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    depends_on: [auth, marketplace, community, usage, frontend]

volumes:
  pgdata:
  uploads:
