[project]
name = "auth-service"
version = "1.0.0"
description = "Portal AI — sign-in (SSO and username/password) and sessions."
requires-python = ">=3.13,<3.14"
dependencies = [
    "portal-kit",
    "argon2-cffi>=23.1",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
]

[tool.uv.sources]
portal-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portal_auth"]
