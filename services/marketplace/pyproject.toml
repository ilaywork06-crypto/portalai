[project]
name = "marketplace-service"
version = "1.0.0"
description = "Portal AI — Skills, Connectors, Agents, Plugins and Apps catalog."
requires-python = ">=3.13,<3.14"
dependencies = ["portal-kit"]

[tool.uv.sources]
portal-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portal_marketplace"]
