[project]
name = "community-service"
version = "1.0.0"
description = "Portal AI — community posts, replies, reposts and attachments."
requires-python = ">=3.13,<3.14"
dependencies = ["portal-kit", "python-multipart>=0.0.18"]

[tool.uv.sources]
portal-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portal_community"]
