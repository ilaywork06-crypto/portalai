# Real single sign-on in development: Keycloak as the OpenID Connect IdP, layered on docker-compose.yml.
#   make dev sso=keycloak    (= docker compose -f docker-compose.yml -f docker-compose.sso.yml up --build)
# Sign-in page: http://localhost:8180 · admin console: http://localhost:8180/admin (admin / admin)
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The browser reaches Keycloak on localhost; the auth service reaches it as keycloak:8080 (back channel).
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      PORTAL_PUBLIC_URL: http://localhost:${GATEWAY_PORT:-8080}
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      start_period: 90s
      retries: 30

  auth:
    depends_on:
      keycloak: { condition: service_healthy }
    environment:
      SSO_MODE: oidc
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/portal
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/portal
      OIDC_CLIENT_ID: portal-ai
      OIDC_CLIENT_SECRET: portal-dev-secret
