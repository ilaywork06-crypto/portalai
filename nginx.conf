# Serves the Vite build from /usr/share/nginx/html/AI. Every API call is answered in the browser by the mock API,
# so there is nothing to proxy.
server {
    listen 80;
    server_tokens off;
    # Relative Location headers, so redirects keep whatever host port the container is published on.
    absolute_redirect off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /        { return 302 /AI/; }
    location = /AI      { return 302 /AI/; }

    # A location with its own add_header drops the server-level ones, so the locations below repeat them.

    # Hashed file names, so they can be cached for good.
    location /AI/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Client-side routes fall back to index.html, which is never cached so a new deploy shows up on reload.
    location /AI/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ /AI/index.html;
    }
}
