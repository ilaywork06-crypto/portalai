[project]
name = "portal-ai"
version = "1.0.0"
description = "Portal AI — Leg 1 monorepo"
requires-python = ">=3.13,<3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["**/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "C4", "PIE", "RET", "TID", "PL"]
ignore = ["E501", "PLR0913", "PLR0917", "PLR2004", "PLR0911", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["portal_kit", "portal_auth", "portal_marketplace", "portal_community", "portal_usage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib -q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
testpaths = ["libs", "services"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["libs/portal-kit/src", "services/auth/src", "services/marketplace/src", "services/community/src", "services/usage/src"]
explicit_package_bases = true
exclude = ["migrations/", "tests/"]
