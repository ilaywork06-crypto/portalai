# Production-like stack from the release images (no mounts, no reload).
#   JWT_SECRET=$(openssl rand -hex 32) docker compose -f docker-compose.prod.yml up --build -d
name: portal-ai-prod

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

x-service-env: &service-env
  ENVIRONMENT: production
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  RUN_MIGRATIONS: "true"
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth:
    <<: *service
    image: portal-ai/auth:${TAG:-latest}
    build: { context: ., dockerfile: deploy/docker/service.Dockerfile, target: runtime, args: { SERVICE: auth, PACKAGE: auth-service } }
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://auth_svc:auth_dev@postgres:5432/auth
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SSO_MODE: ${SSO_MODE:-dev}
      ALLOW_DEV_IDENTITY_PROVIDER: ${ALLOW_DEV_IDENTITY_PROVIDER:-true}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-preferred_username}

  marketplace:
    <<: *service
    image: portal-ai/marketplace:${TAG:-latest}
    build: { context: ., dockerfile: deploy/docker/service.Dockerfile, target: runtime, args: { SERVICE: marketplace, PACKAGE: marketplace-service } }
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://marketplace_svc:marketplace_dev@postgres:5432/marketplace

  community:
    <<: *service
    image: portal-ai/community:${TAG:-latest}
    build: { context: ., dockerfile: deploy/docker/service.Dockerfile, target: runtime, args: { SERVICE: community, PACKAGE: community-service } }
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://community_svc:community_dev@postgres:5432/community
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads

  usage:
    <<: *service
    image: portal-ai/usage:${TAG:-latest}
    build: { context: ., dockerfile: deploy/docker/service.Dockerfile, target: runtime, args: { SERVICE: usage, PACKAGE: usage-service } }
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://usage_svc:usage_dev@postgres:5432/usage

  web:
    image: portal-ai/web:${TAG:-latest}
    build: { context: ./frontend, target: runtime }
    restart: unless-stopped

  gateway:
    image: portal-ai/gateway:${TAG:-latest}
    build: { context: ./deploy/gateway }
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    depends_on:
      auth: { condition: service_healthy }
      marketplace: { condition: service_healthy }
      community: { condition: service_healthy }
      usage: { condition: service_healthy }
      web: { condition: service_started }

volumes:
  pgdata:
  uploads:
